server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: edgepoint-api

  datasource:
    url: jdbc:postgresql://localhost:5432/edgepoint
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: edgepoint-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  security:
    # Read by JwtService / AuthServiceImpl (@Value("${spring.security.jwt.*}")).
    # secret-key must be base64 — JwtService base64-decodes it before building the HMAC key.
    jwt:
      secret-key: ${JWT_SECRET:iBD+TO3fXjqpq5xt3tvYaTwWC7arMYhdnJaJAXb+TVU=}
      expiration: ${JWT_EXPIRATION:86400000}

app:
  api-version: v1

  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000

  file:
    upload-dir: /tmp/edgepoint/uploads
    max-size-mb: 50

  stripe:
    api-key: ${STRIPE_API_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  security:
    # Base64-encoded AES-256 key used to encrypt secret columns at rest
    # (e.g. notification_configs.smtp_password / whatsapp_api_key).
    # Dev-only default below — MUST be overridden via ENCRYPTION_KEY in every other environment.
    encryption-key: ${ENCRYPTION_KEY:6JsyJxpJbSMdwIdlS8/5YLhoE/uf5V4++iLNuqCksFg=}

  # Discord webhook for ops alerts (frequent failures, slow requests, support submissions).
  # Left blank by default — DiscordAlertService no-ops (logs a warning) when unset, so local
  # dev and CI never need a real webhook. Set DISCORD_WEBHOOK_URL to enable.
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}

  alerting:
    # "Frequent failures": alert if this many unhandled 5xx errors occur within the window below.
    error-threshold-count: ${ALERT_ERROR_THRESHOLD_COUNT:5}
    error-threshold-window-seconds: ${ALERT_ERROR_WINDOW_SECONDS:60}
    # "Very slow requests": alert any single request slower than this.
    slow-request-threshold-ms: ${ALERT_SLOW_REQUEST_MS:3000}
    # Minimum gap between two alerts of the same kind, so a sustained outage doesn't flood Discord.
    cooldown-seconds: ${ALERT_COOLDOWN_SECONDS:300}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    build:
      enabled: true
    env:
      enabled: true

logging:
  level:
    com.edgepoint: DEBUG
    org.springframework.security: INFO
