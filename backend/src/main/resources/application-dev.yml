spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:college_management;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: false

  redis:
    host: localhost
    port: 6379

  server:
    port: 8080

app:
  jwt:
    secret: dev-secret-key-dev-secret-key-dev-secret-key

  stripe:
    api-key: stripe-test-key-placeholder-not-real
