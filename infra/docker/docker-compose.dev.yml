services:
  backend:
    image: maven:3.8-openjdk-17-slim
    container_name: college-mgmt-backend-dev
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      # Bind mount the local backend source code directly into the container
      - ../../backend:/app
      # Provide a named volume for Maven cache so dependencies aren't downloaded every time
      - maven_cache:/root/.m2
    command: mvn spring-boot:run
    environment:
      # Ensure it correctly points to the postgres container defined in main infra/docker/docker-compose.yml
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/college_management
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres
    networks:
      - college-network

  frontend:
    image: node:20-alpine
    container_name: college-mgmt-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      # Bind mount local frontend code for real-time HMR (Hot Module Replacement)
      - ../../frontend:/app
      # Prevent the host's node_modules from overwriting the container's volume 
      # (especially useful because of OS differences in C++ compiled node modules)
      - /app/node_modules
    # Start up the vite dev server and expose it on 0.0.0.0 so we can access it from localhost
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - college-network

volumes:
  maven_cache:
