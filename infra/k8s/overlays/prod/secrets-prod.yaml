# Overrides infra/k8s/base/secrets.yaml's shared placeholders so prod no longer runs on the
# exact same DB password / JWT secret / encryption key as test (base/secrets.yaml's own
# comment used to flag this as the real, unfixed state). These are STILL placeholders, not
# real credentials — a real prod deploy MUST replace every value here via a secrets manager
# (sealed-secrets/external-secrets/Vault), never by committing real secrets to this file.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  username: postgres
  password: prod-placeholder-db-password-REPLACE-BEFORE-REAL-USE
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
type: Opaque
stringData:
  secret: "70726F642D6F6E6C792D6A7774-2D7365637265742D52455045315245"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  # Base64-encoded AES-256 key placeholder — see core/security/crypto/EncryptedStringConverter.
  encryption-key: cHJvZC1vbmx5LXBsYWNlaG9sZGVyLWtleS1SRVBMQUNFLU1F
---
apiVersion: v1
kind: Secret
metadata:
  name: discord-secret
type: Opaque
stringData:
  # Empty placeholder — DiscordAlertService no-ops (logs a warning) when unset. Replace with
  # the real prod ops-channel incoming webhook URL; never commit the real one to git.
  webhook-url: ""
