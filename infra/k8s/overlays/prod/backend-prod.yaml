apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://prod-postgres-service:5432/edgepoint
            # SPRING_JPA_HIBERNATE_DDL_AUTO=update stopgap removed 2026-10-06: the missing
            # tables (subjects/classes/marks/attendance_records/etc.) are now created by
            # backend/src/main/resources/db/migration/V2__add_academic_attendance_schema.sql
            # and the courses drift is fixed by V3__fix_courses_schema_drift.sql, so prod
            # falls back to the base default `validate` — the only safe setting for prod.
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: 2000m
              memory: 1536Mi
