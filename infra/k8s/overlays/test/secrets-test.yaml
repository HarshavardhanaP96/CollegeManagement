# Overrides infra/k8s/base/secrets.yaml's shared placeholders so test no longer runs on the
# exact same DB password / JWT secret / encryption key as prod (base/secrets.yaml's own
# comment used to flag this as the real, unfixed state). Still placeholders, not real
# credentials — replace via a secrets manager (sealed-secrets/external-secrets/Vault) or a
# `kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -` step before this
# overlay is ever pointed at a real test environment.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  username: postgres
  password: test-placeholder-db-password-change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
type: Opaque
stringData:
  secret: "746573742D6F6E6C792D6A7774-2D7365637265742D706C616365686F6C646572"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  # Base64-encoded AES-256 key placeholder — see core/security/crypto/EncryptedStringConverter.
  encryption-key: dGVzdC1vbmx5LXBsYWNlaG9sZGVyLWtleS1jaGFuZ2UtbWU=
---
apiVersion: v1
kind: Secret
metadata:
  name: discord-secret
type: Opaque
stringData:
  # Empty by default (DiscordAlertService no-ops) — set a test-channel webhook if you want
  # test-environment alerts to go somewhere other than prod's channel.
  webhook-url: ""
