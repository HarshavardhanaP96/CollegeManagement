apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://test-postgres-service:5432/edgepoint
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              # infra/k8s/base/db/init-db.sql only seeds the original core tables — it doesn't
              # create subjects/classes/marks/attendance_records/notification_configs/etc., so
              # the app can't start against `ddl-auto: validate` (the base default) without this.
              # This is a stopgap (same one overlays/local already relies on), not a real fix —
              # replace with a proper Flyway baseline migration covering the full schema, then
              # remove this override.
              value: update
