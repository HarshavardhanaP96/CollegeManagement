apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Scraped by infra/k8s/monitoring's Prometheus (kubernetes_sd_configs, pod role) —
        # see docs/OBSERVABILITY.md. /api/v1/actuator/prometheus is permitted without auth
        # in WebSecurityConfig for exactly this.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: backend
        image: your-registry-url/college-mgmt-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          # Must match the app's real default DB name (see backend/src/main/resources/
          # application.yml) — this previously said "college_management", a name the app
          # itself never uses, which only "worked" by coincidence because this env var always
          # overrides the yml default anyway. Fixed for consistency with local dev and docs.
          value: jdbc:postgresql://postgres-service:5432/edgepoint
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        - name: ENCRYPTION_KEY
          # AES-256 key for encrypting secret columns at rest (e.g. notification config
          # credentials — see core/security/crypto/EncryptedStringConverter). Without this,
          # the app silently falls back to the dev-only default baked into application.yml.
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: encryption-key
        - name: DISCORD_WEBHOOK_URL
          # Discord incoming-webhook URL for ops alerts (frequent failures, slow requests,
          # support submissions — see DiscordAlertService / docs/OBSERVABILITY.md). Blank
          # placeholder by default; the service just logs a warning and skips sending when unset.
          valueFrom:
            secretKeyRef:
              name: discord-secret
              key: webhook-url
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        # application.yml already enables management.health.livenessstate/readinessstate —
        # this was never wired to an actual probe, so Kubernetes had no way to know the app
        # was still starting (~90s: Flyway + Hibernate validate) vs. actually unhealthy.
        # startupProbe covers the slow boot; liveness/readiness only start after it succeeds.
        startupProbe:
          httpGet:
            path: /api/v1/actuator/health
            port: 8080
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/v1/actuator/health/readiness
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/actuator/health/liveness
            port: 8080
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
