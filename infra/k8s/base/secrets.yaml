# These are LOCAL/DEV-ONLY placeholder values, safe to commit only because they're identical
# to the ones already baked as dev defaults into backend/src/main/resources/application.yml.
# Used as-is by the `local` overlay. `test` and `prod` each override every one of these via
# their own secrets-test.yaml/secrets-prod.yaml patch (infra/k8s/overlays/{test,prod}) — still
# placeholders, not real credentials, but no longer identical between environments. Before
# either overlay is pointed at a real environment, replace those placeholders via a proper
# secrets manager (sealed-secrets/external-secrets/Vault) or a
# `kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -` post-deploy step.
# Never commit real test/prod credentials here or in the overlay patches.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  username: postgres
  password: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
type: Opaque
stringData:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  # Base64 AES-256 key — see core/security/crypto/EncryptedStringConverter.
  encryption-key: xeFMpAJwLy3LWjERNtLQGSUJcIGVSHlH/+v6KrYIVMA=
---
apiVersion: v1
kind: Secret
metadata:
  name: discord-secret
type: Opaque
stringData:
  # Empty placeholder — DiscordAlertService no-ops (logs a warning) when unset, so this is safe
  # to leave blank. Replace with a real Discord incoming-webhook URL per environment; never
  # commit a real one here. See docs/OBSERVABILITY.md.
  webhook-url: ""
